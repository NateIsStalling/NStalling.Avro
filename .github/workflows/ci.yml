name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/NStalling.Avro.sln

      - name: Build
        run: dotnet build src/NStalling.Avro.sln --no-restore --configuration Release

      - name: Test
        env:
          # NStalling.Avro.PropertyTests runs as part of this solution-wide test pass, so it's already
          # gated and its coverage already lands in ./coverage alongside the example-based suite. Each
          # property is cheap (in-memory resolver logic, no I/O), so raise CsCheck's default iteration
          # count for deeper search on every run; failures print a reproducible seed, so there's nothing
          # to configure for retries.
          CsCheck_Iter: 10000
        run: >
          dotnet test src/NStalling.Avro.sln --no-build --configuration Release
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

      - name: Generate coverage summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:coverage/**/coverage.cobertura.xml \
            -targetdir:coverage/report \
            -reporttypes:MarkdownSummaryGithub

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/report/SummaryGithub.md';
            if (!fs.existsSync(path)) return;

            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
